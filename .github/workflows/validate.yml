{
  "name": "Validate project",
  "on": [
    "push",
    "pull_request",
    "workflow_dispatch"
  ],
  "permissions": {
    "contents": "read"
  },
  "concurrency": {
    "group": "${{ github.workflow }}:${{ github.event.pull_request.head.repo.full_name || github.repository }}:${{ github.ref_type == 'tag' && 'tag' || 'branch' }}:${{ github.head_ref || github.ref_name }}:${{ github.event_name == 'workflow_dispatch' && github.run_id || 'automatic' }}",
    "cancel-in-progress": "${{ github.ref != 'refs/heads/main' && github.event_name != 'workflow_dispatch' }}"
  },
  "jobs": {
    "baseline": {
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 15,
      "permissions": {
        "contents": "read",
        "pull-requests": "read"
      },
      "outputs": {
        "class": "${{ steps.classify.outputs.class }}",
        "checkout": "${{ steps.snapshot.outputs.sha }}"
      },
      "steps": [
        {
          "uses": "actions/checkout@11d5960a326750d5838078e36cf38b85af677262",
          "with": {
            "fetch-depth": 0,
            "persist-credentials": false
          }
        },
        {
          "uses": "actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065",
          "with": {
            "python-version": "3.12"
          }
        },
        {
          "id": "context",
          "name": "Resolve integration context",
          "env": {
            "GH_TOKEN": "${{ github.token }}"
          },
          "run": "python3 scripts/ci_context.py"
        },
        {
          "uses": "actions/checkout@11d5960a326750d5838078e36cf38b85af677262",
          "with": {
            "fetch-depth": 0,
            "persist-credentials": false,
            "ref": "${{ steps.context.outputs.ref }}"
          }
        },
        {
          "id": "snapshot",
          "name": "Freeze validated checkout",
          "env": {
            "CI_CHECKOUT_REF": "${{ steps.context.outputs.ref }}"
          },
          "run": "python3 scripts/ci_context.py snapshot"
        },
        {
          "id": "classify",
          "name": "Classify complete change",
          "run": "set -eu\nclassification=\"$(python3 scripts/verify classify)\"\ncase \"$classification\" in docs|full) ;; *) echo \"Invalid CI classification\" >&2; exit 1;; esac\nprintf 'class=%s\\n' \"$classification\" >> \"$GITHUB_OUTPUT\"",
          "env": {
            "CI_CHECKOUT_REF": "${{ steps.context.outputs.ref }}"
          }
        },
        {
          "name": "Repository, project and document checks",
          "run": "python3 scripts/verify baseline"
        }
      ]
    },
    "full": {
      "needs": [
        "baseline"
      ],
      "if": "${{ needs.baseline.result == 'success' && needs.baseline.outputs.class != 'docs' }}",
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 15,
      "steps": [
        {
          "uses": "actions/checkout@11d5960a326750d5838078e36cf38b85af677262",
          "with": {
            "fetch-depth": 0,
            "persist-credentials": false,
            "ref": "${{ needs.baseline.outputs.checkout }}"
          }
        },
        {
          "uses": "oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6",
          "with": {
            "bun-version-file": ".bun-version"
          }
        },
        {
          "uses": "actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065",
          "with": {
            "python-version": "3.12"
          }
        },
        {
          "run": "bun install --frozen-lockfile"
        },
        {
          "name": "Prepare missing Linux packages once",
          "run": "python3 scripts/ci_prepare_linux.py"
        },
        {
          "run": "node node_modules/@playwright/test/cli.js install chromium"
        },
        {
          "name": "Canonical application verification",
          "run": "python3 scripts/verify application"
        },
        {
          "name": "Fictional E1.1\u2013E1.5 screenshots",
          "if": "always()",
          "uses": "actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02",
          "with": {
            "name": "e1-1-screenshots",
            "path": "artifacts/e1-1/*.png\nartifacts/e1-2/*.png\nartifacts/e1-3/*.png\nartifacts/e1-4/*.png\nartifacts/e1-5/*.png\nartifacts/e1-6/*.png\nartifacts/e2-1/*.png\nartifacts/e2-3/*.png\nartifacts/e2-4/*.png",
            "if-no-files-found": "ignore",
            "retention-days": 7
          }
        }
      ]
    },
    "required": {
      "needs": [
        "baseline",
        "full"
      ],
      "if": "${{ always() }}",
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 5,
      "steps": [
        {
          "uses": "actions/checkout@11d5960a326750d5838078e36cf38b85af677262",
          "with": {
            "fetch-depth": 0,
            "persist-credentials": false,
            "ref": "${{ needs.baseline.outputs.checkout || github.sha }}"
          }
        },
        {
          "uses": "actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065",
          "with": {
            "python-version": "3.12"
          }
        },
        {
          "name": "Reject failed or unexpectedly skipped checks",
          "env": {
            "CI_CLASS": "${{ needs.baseline.outputs.class }}",
            "CI_BASELINE": "${{ needs.baseline.result }}",
            "CI_FULL": "${{ needs.full.result }}"
          },
          "run": "python3 scripts/verify result"
        }
      ]
    }
  }
}
