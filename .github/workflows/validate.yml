{
  "name": "B3 sequence diagnostic \u2014 not acceptance CI",
  "on": {
    "push": {
      "branches": [
        "codex/diagnose-b3-sequence"
      ]
    }
  },
  "permissions": {
    "contents": "read"
  },
  "jobs": {
    "diagnostic": {
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 12,
      "steps": [
        {
          "uses": "actions/checkout@11d5960a326750d5838078e36cf38b85af677262",
          "with": {
            "fetch-depth": 0,
            "persist-credentials": false
          }
        },
        {
          "uses": "actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065",
          "with": {
            "python-version": "3.12"
          }
        },
        {
          "uses": "oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6",
          "with": {
            "bun-version": "1.4.3"
          }
        },
        {
          "run": "bun install --frozen-lockfile"
        },
        {
          "run": "python3 scripts/diagnostics/test-b3-sequence.py"
        },
        {
          "run": "python3 scripts/diagnostics/b3-sequence.py"
        }
      ]
    }
  }
}
