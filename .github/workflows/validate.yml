{
  "name": "B3 isolated diagnostic — not acceptance CI",
  "on": {
    "push": {
      "branches": [
        "codex/probe-b3-parent-20261023"
      ]
    }
  },
  "permissions": {
    "contents": "read"
  },
  "jobs": {
    "probe": {
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 5,
      "steps": [
        {
          "uses": "actions/checkout@11d5960a326750d5838078e36cf38b85af677262",
          "with": {
            "fetch-depth": 0,
            "persist-credentials": false
          }
        },
        {
          "uses": "actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065",
          "with": {
            "python-version": "3.12"
          }
        },
        {
          "uses": "oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6",
          "with": {
            "bun-version-file": ".bun-version"
          }
        },
        {
          "run": "bun install --frozen-lockfile"
        },
        {
          "name": "Run isolated synthetic B3 matrix (no suite)",
          "run": "NODE_ENV=test bun scripts/investigations/b3-parent-probe.ts"
        }
      ]
    }
  }
}
