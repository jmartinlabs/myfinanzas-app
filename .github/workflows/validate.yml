name: Validate project
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version
      - name: Repository, project and document checks
        run: |
          ./scripts/check-repository
          ./scripts/check-project
          ./scripts/validate-template
          ./scripts/test-checks
          ./scripts/test-validator
          git diff --check
          git show --format= --check HEAD
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run build
      - name: Install approved local backup tool
        run: sudo apt-get update && sudo apt-get install -y age
      - run: bun run test
      - run: bunx playwright install --with-deps chromium
      - run: bun run test:e2e
      - name: Fictional E1.1–E1.5 screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: e1-1-screenshots
          path: |
            artifacts/e1-1/*.png
            artifacts/e1-2/*.png
            artifacts/e1-3/*.png
            artifacts/e1-4/*.png
            artifacts/e1-5/*.png
            artifacts/e1-6/*.png
          if-no-files-found: ignore
          retention-days: 7
