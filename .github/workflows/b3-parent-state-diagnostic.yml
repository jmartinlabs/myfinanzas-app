{
  "name": "B3 parent state contrast \u2014 not acceptance CI",
  "on": {
    "pull_request": {
      "types": [
        "opened"
      ]
    }
  },
  "permissions": {
    "contents": "read"
  },
  "jobs": {
    "capture": {
      "if": "${{ github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'codex/diag-b3-parent-state' && github.base_ref == 'codex/dev14-base-b' }}",
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 25,
      "steps": [
        {
          "uses": "actions/checkout@11d5960a326750d5838078e36cf38b85af677262",
          "with": {
            "fetch-depth": 0,
            "persist-credentials": false,
            "ref": "${{ github.event.pull_request.head.sha }}"
          }
        },
        {
          "uses": "oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6",
          "with": {
            "bun-version-file": ".bun-version"
          }
        },
        {
          "uses": "actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065",
          "with": {
            "python-version": "3.12"
          }
        },
        {
          "run": "bun install --frozen-lockfile"
        },
        {
          "name": "Prepare approved Linux prerequisites",
          "run": "python3 scripts/ci_prepare_linux.py"
        },
        {
          "name": "Two bounded contexts, one execution each",
          "run": "python3 scripts/diagnostics/b3-parent-state/run.py"
        },
        {
          "name": "Technical metadata only",
          "if": "always()",
          "uses": "actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02",
          "with": {
            "name": "b3-parent-state-technical-metadata",
            "path": "artifacts/b3-parent-state/*.json\nartifacts/b3-parent-state/*.jsonl",
            "if-no-files-found": "error",
            "retention-days": 7
          }
        }
      ]
    }
  }
}
